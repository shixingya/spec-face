nglish】seamless pure white backdrop lit independently with no grey falloff, clean subject separation</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-02 浅灰到白渐变 Light Grey to White Gradient 45 度主光加反射板，背景留轻微中心亮、边缘暗 企业工卡、官网团队页、简历照", "html": "<div class=\"id\">B-02</div><div class=\"t\">浅灰到白渐变 <span class=\"en\">Light Grey to White Gradient</span></div><div class=\"row\"><span class=\"sw\" style=\"background:rgb(214, 216, 219)\"></span><b>目标色</b> rgb(214, 216, 219) ±None </div><div class=\"row\"><b>光型</b> 45 度主光加反射板，背景留轻微中心亮、边缘暗</div><div class=\"row en\">45-degree key with reflector, slight center brightness and edge falloff</div><div class=\"row\"><b>适用</b> 企业工卡、官网团队页、简历照</div><pre>【中文】浅灰渐变影棚背景，中心略亮四周柔和收暗，整体通透干净\n\n【English】light grey studio gradient, brighter at center with soft edge falloff, airy and clean overall</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-03 中性灰纯色 Neutral Solid Grey 柔光主光加轻微轮廓光，人物与背景明度分离 创意与职能岗、对外沟通头像", "html": "<div class=\"id\">B-03</div><div class=\"t\">中性灰纯色 <span class=\"en\">Neutral Solid Grey</span></div><div class=\"row\"><span class=\"sw\" style=\"background:rgb(150, 152, 155)\"></span><b>目标色</b> rgb(150, 152, 155) ±None </div><div class=\"row\"><b>光型</b> 柔光主光加轻微轮廓光，人物与背景明度分离</div><div class=\"row en\">Soft key with slight rim light, subject separated by brightness</div><div class=\"row\"><b>适用</b> 创意与职能岗、对外沟通头像</div><pre>【中文】中性纯色灰背景，均匀无杂斑，人物有轻微轮廓光与背景分离\n\n【English】even neutral grey backdrop free of mottling, subject separated by a subtle rim light</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-04 深藏青纯色 Deep Navy Solid 较高对比硬光，主光位偏高，塑造权威线条 金融、法务、管理层", "html": "<div class=\"id\">B-04</div><div class=\"t\">深藏青纯色 <span class=\"en\">Deep Navy Solid</span></div><div class=\"row\"><span class=\"sw\" style=\"background:rgb(28, 38, 62)\"></span><b>目标色</b> rgb(28, 38, 62) ±None </div><div class=\"row\"><b>光型</b> 较高对比硬光，主光位偏高，塑造权威线条</div><div class=\"row en\">Higher-contrast harder key placed high, sculpting authoritative lines</div><div class=\"row\"><b>适用</b> 金融、法务、管理层</div><pre>【中文】深藏青纯色背景，主光位略高、对比明确，肩线与背景清晰分离\n\n【English】deep navy solid backdrop, slightly elevated key with defined contrast, shoulders cleanly separated</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-05 医疗浅蓝绿 Clinical Pale Blue-Green 高调柔光，几乎无阴影，色彩偏冷白 医护、口腔、诊所、药房", "html": "<div class=\"id\">B-05</div><div class=\"t\">医疗浅蓝绿 <span class=\"en\">Clinical Pale Blue-Green</span></div><div class=\"row\"><span class=\"sw\" style=\"background:rgb(208, 230, 231)\"></span><b>目标色</b> rgb(208, 230, 231) ±None </div><div class=\"row\"><b>光型</b> 高调柔光，几乎无阴影，色彩偏冷白</div><div class=\"row en\">High-key soft light, near-shadowless, cool-white cast</div><div class=\"row\"><b>适用</b> 医护、口腔、诊所、药房</div><pre>【中文】浅蓝绿医疗色系背景，高调明亮、阴影极弱，画面洁净无杂物\n\n【English】pale blue-green clinical backdrop, high-key with minimal shadows, spotless and clutter-free</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-06 暖调微纹理纸面 Warm Textured Paper 侧位柔光保留纸纹明暗，人物光略暖 咨询顾问、教育、文创岗", "html": "<div class=\"id\">B-06</div><div class=\"t\">暖调微纹理纸面 <span class=\"en\">Warm Textured Paper</span></div><div class=\"row\"><span class=\"sw\" style=\"background:rgb(232, 222, 208)\"></span><b>目标色</b> rgb(232, 222, 208) ±None </div><div class=\"row\"><b>光型</b> 侧位柔光保留纸纹明暗，人物光略暖</div><div class=\"row en\">Side soft light keeping paper texture, subject light slightly warm</div><div class=\"row\"><b>适用</b> 咨询顾问、教育、文创岗</div><pre>【中文】暖色微纹理纸面背景，可见极细纹理但不喧宾，人物光柔和偏暖\n\n【English】warm finely textured paper backdrop with visible but quiet grain, soft slightly warm subject light</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-07 办公室轻度虚化 Soft Office Blur 窗光为主加室内环境光，背景虚化控制在中等程度 对外销售、门店店长、顾问", "html": "<div class=\"id\">B-07</div><div class=\"t\">办公室轻度虚化 <span class=\"en\">Soft Office Blur</span></div><div class=\"row\"><span class=\"mut\">不锁定底色（需按对象或品牌定）</span></div><div class=\"row\"><b>光型</b> 窗光为主加室内环境光，背景虚化控制在中等程度</div><div class=\"row en\">Window key with ambient fill, moderate background blur</div><div class=\"row\"><b>适用</b> 对外销售、门店店长、顾问</div><div class=\"row warn\">⚠ 批量场景不建议使用：环境光难统一，会导致整批不一致</div><pre>【中文】办公环境轻度虚化背景，可辨认空间但不出现文字与人脸，主体清晰\n\n【English】lightly blurred office setting, space readable but no legible text or other faces, subject sharp</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "B-08 品牌指定纯色 Brand-Specified Solid 按品牌 VI 色值打背景，需先录入客户 RGB 企业统一工卡、连锁门店", "html": "<div class=\"id\">B-08</div><div class=\"t\">品牌指定纯色 <span class=\"en\">Brand-Specified Solid</span></div><div class=\"row\"><span class=\"mut\">不锁定底色（需按对象或品牌定）</span></div><div class=\"row\"><b>光型</b> 按品牌 VI 色值打背景，需先录入客户 RGB</div><div class=\"row en\">Match the client&#x27;s VI color value; RGB must be supplied first</div><div class=\"row\"><b>适用</b> 企业统一工卡、连锁门店</div><div class=\"row warn\">需输入：brand_rgb</div><pre>【中文】客户品牌指定纯色背景，色值严格一致，全批次不得漂移\n\n【English】client-specified brand solid backdrop held to exact color value across the whole batch</pre><button class=\"copy\">复制双语提示词</button>"}], "e": [{"search": "E-01 平静专注 Calm Focus 嘴唇自然闭合，眼周放松，目光稳定不游移", "html": "<div class=\"id\">E-01</div><div class=\"t\">平静专注 <span class=\"en\">Calm Focus</span></div><div class=\"row\">嘴唇自然闭合，眼周放松，目光稳定不游移</div><div class=\"row en\">Lips naturally closed, relaxed eye area, steady gaze</div><div class=\"row\"><b>微笑幅度</b> 0.00 / 1.00</div><pre>【中文】表情平静专注，嘴唇自然闭合，目光稳定落在镜头上\n\n【English】calm focused expression, lips naturally closed, gaze steady on the lens</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-02 亲和浅笑 Approachable Light Smile 嘴角上提 15 度以内，不露或微露齿，苹果肌自然发力", "html": "<div class=\"id\">E-02</div><div class=\"t\">亲和浅笑 <span class=\"en\">Approachable Light Smile</span></div><div class=\"row\">嘴角上提 15 度以内，不露或微露齿，苹果肌自然发力</div><div class=\"row en\">Mouth corners raised under 15 degrees, teeth none or barely, genuine cheek lift</div><div class=\"row\"><b>微笑幅度</b> 0.40 / 1.00</div><pre>【中文】亲和的浅笑，嘴角轻微上提、不刻意露齿，眼神同时变暖\n\n【English】approachable light smile, mouth corners gently raised without forced teeth, eyes warming in sync</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-03 温和耐心 Gentle Patience 眉眼舒展，笑意很浅但持续，注视不带催促感", "html": "<div class=\"id\">E-03</div><div class=\"t\">温和耐心 <span class=\"en\">Gentle Patience</span></div><div class=\"row\">眉眼舒展，笑意很浅但持续，注视不带催促感</div><div class=\"row en\">Soft brows, faint sustained smile, unhurried attention</div><div class=\"row\"><b>微笑幅度</b> 0.30 / 1.00</div><pre>【中文】温和耐心的神态，眉眼完全舒展，微笑幅度很小但真实\n\n【English】gentle patient demeanor, brows fully relaxed, a very small but genuine smile</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-04 沉稳权威 Grounded Authority 面部肌肉整体放松但下颌明确，注视时长略增", "html": "<div class=\"id\">E-04</div><div class=\"t\">沉稳权威 <span class=\"en\">Grounded Authority</span></div><div class=\"row\">面部肌肉整体放松但下颌明确，注视时长略增</div><div class=\"row en\">Relaxed face with a defined jawline, slightly sustained eye contact</div><div class=\"row\"><b>微笑幅度</b> 0.05 / 1.00</div><pre>【中文】沉稳权威的神态，面部松弛但下颌线明确，注视稳定不回避\n\n【English】grounded authoritative demeanor, relaxed face with a clear jawline, sustained unavoiding eye contact</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-05 内敛克制 Reserved Restraint 情绪幅度压到最低，适合技术与财务岗", "html": "<div class=\"id\">E-05</div><div class=\"t\">内敛克制 <span class=\"en\">Reserved Restraint</span></div><div class=\"row\">情绪幅度压到最低，适合技术与财务岗</div><div class=\"row en\">Emotion held to a minimum; suits engineering and finance</div><div class=\"row\"><b>微笑幅度</b> 0.00 / 1.00</div><pre>【中文】内敛克制的神态，表情几乎无起伏，目光安静而聚焦\n\n【English】reserved restrained expression, near-flat affect, quiet focused eyes</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-06 明快主动 Bright Initiative 眉尾轻微上挑，笑意明确，眼神先一步打招呼", "html": "<div class=\"id\">E-06</div><div class=\"t\">明快主动 <span class=\"en\">Bright Initiative</span></div><div class=\"row\">眉尾轻微上挑，笑意明确，眼神先一步打招呼</div><div class=\"row en\">Slight brow lift, clear smile, eyes greeting first</div><div class=\"row\"><b>微笑幅度</b> 0.60 / 1.00</div><pre>【中文】明快主动的神态，眉尾轻微上挑，笑意明确但不夸张\n\n【English】bright proactive demeanor, brows lifting slightly, a clear but never exaggerated smile</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-07 严谨中性 Strictly Neutral 证件与签证级中性表情，禁止微笑", "html": "<div class=\"id\">E-07</div><div class=\"t\">严谨中性 <span class=\"en\">Strictly Neutral</span></div><div class=\"row\">证件与签证级中性表情，禁止微笑</div><div class=\"row en\">ID and visa grade neutral expression, no smiling allowed</div><div class=\"row\"><b>微笑幅度</b> 0.00 / 1.00</div><div class=\"row warn\">多数国家签证照要求中性表情且双眼睁开，不得露齿笑</div><pre>【中文】严谨中性的面部状态，双唇闭合、肌肉完全放松、无任何笑意\n\n【English】strictly neutral facial state, lips sealed, muscles fully relaxed, no trace of a smile</pre><button class=\"copy\">复制双语提示词</button>"}, {"search": "E-08 自信松弛 Confident Ease 肩线与面部同时松下来，笑或不笑都可以", "html": "<div class=\"id\">E-08</div><div class=\"t\">自信松弛 <span class=\"en\">Confident Ease</span></div><div class=\"row\">肩线与面部同时松下来，笑或不笑都可以</div><div class=\"row en\">Shoulders and face both released; smile optional</div><div class=\"row\"><b>微笑幅度</b> 0.35 / 1.00</div><pre>【中文】自信松弛的神态，面部与肩颈同时放松，不刻意摆拍也不紧绷\n\n【English】confident easy demeanor, face and shoulders released together, neither posed nor tense</pre><button class=\"copy\">复制双语提示词</button>"}], "s": [{"search": "S-01 一寸照 1-inch Photo 白底 简历、报名、入职工卡通用底稿 px, aspect, dpi, max_kb, format, bg_color, head_ratio, eye_line", "html": "<div class=\"id\">S-01</div><div class=\"t\">一寸照 <span class=\"en\">1-inch Photo</span></div><div class=\"row\"><b>尺寸</b> 295×413px / 300dpi · 25×35mm · 比例 1:1:1.4（）</div><div class=\"row\"><b>底色</b> <span class=\"sw\" style=\"background:rgb(255, 255, 255)\"></span>rgb(255, 255, 255) ±12 <span class=\"en\">白底</span></div><div class=\"row\"><b>头部占比</b> 62%–72% · <b>瞳孔线</b> 底部起 55%–68%</div><div class=\"row\"><b>表情</b> 中性或轻微微笑，双眼平视，嘴闭合</div><div class=\"row\"><b>文件</b> ≤300KB · jpg/png</div><div class=\"row\"><b>校验项</b> px, aspect, dpi, m const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function swatch(rgb){return rgb?`<span class="sw" style="background:rgb(${rgb.join(',')})"></span>`:''}
function card(o){return `<div class="card" data-s="${esc(o.search)}">${o.html}</div>`}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const items=D[tab].filter(o=>!q||o.search.toLowerCase().includes(q));
  document.getElementById('g').innerHTML=items.map(o=>card(o)).join('')||'<div class="mut" style="padding:20px">无匹配结果</div>';
  document.getElementById('n').textContent=`${items.length} 项`;
}
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');tab=b.dataset.t;render();
});
document.addEventListener('click',e=>{
  if(!e.target.classList.contains('copy'))return;
  const t=e.target.closest('.card').querySelector('pre').textContent;
  navigator.clipboard.writeText(t).then(()=>{e.target.textContent='已复制 ✓';
    setTimeout(()=>e.target.textContent='复制双语提示词',1300);});
});
render();
</script>
</body>
</html>
